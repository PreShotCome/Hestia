name: Build & Distribute Hestia APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hestia-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.HESTIA_FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # ---------------------------------------------------------------
          # TESTERS — who receives the build.
          # Add your partner (or anyone else) later by extending this into a
          # comma-separated list, with no spaces, then push to main:
          #   testers: ianrocks62@gmail.com,partner@example.com
          # (You can also add testers anytime from the Firebase App
          # Distribution console without changing this file.)
          # ---------------------------------------------------------------
          testers: ianrocks62@gmail.com
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Hestia — Find anything in your home. | ${{ github.sha }}"
